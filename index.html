/* ---------- data ---------- */
const DATA = RAW.trim().split("\n").map((line, i) => {
  const [wk, s, zh, alt] = line.split("|");
  const w = s.match(/\{([^}]+)\}/)[1];
  const bm = zh.match(/（([A-Za-z\- ]+)）/);
  return { id: i, wk: +wk, s, w, zh, alt: alt || "", base: bm ? bm[1] : w };
});
const WEEKS = [6, 7, 8, 9, 10, 16, 17, 18, 19, 20];
const K_KNOWN = "ncut-1152-vocab-known", K_STATS = "ncut-1152-vocab-stats",
      K_BEST = "ncut-1152-vocab-best", K_HINT = "ncut-1152-vocab-hint";

/* ---------- storage ---------- */
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let known = new Set(load(K_KNOWN, []));
let stats = load(K_STATS, {});          // id -> {r, w, last}
let best = load(K_BEST, null);          // {score, n, date}
let hintFirst = load(K_HINT, true);
function record(id, ok) {
  const s = stats[id] || { r: 0, w: 0, last: null };
  ok ? s.r++ : s.w++; s.last = ok ? 1 : 0; stats[id] = s; store(K_STATS, stats);
}
const wrongList = () => DATA.filter(d => stats[d.id] && stats[d.id].last === 0);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const app = $("app");
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function blank(w, h) { return h ? w.split("").map((c, i) => i === 0 ? c : (c === "-" ? "-" : "_")).join(" ") : "＿＿＿＿＿"; }
function sentHTML(d, mode, h) {
  return esc(d.s).replace(/\{([^}]+)\}/, (m, w) =>
    mode === "show" ? `<span class="hl">${esc(w)}</span>` : `<span class="blank">${esc(blank(w, h))}</span>`);
}
function makeOpts(d) {
  const others = shuffle(DATA.filter(x => x.wk === d.wk && x.w !== d.w).map(x => x.w));
  return shuffle([d.w, ...others.slice(0, 3)]);
}
function norm(s) { return s.trim().toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, " "); }
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function checkSpell(d, given) {
  const g = norm(given), ans = d.w.toLowerCase();
  if (g === ans) return { ok: true, note: "" };
  let note = "";
  if (d.base !== d.w && g === d.base.toLowerCase()) note = `詞形要跟句子一致，要寫 ${d.w}`;
  else if (lev(g, ans) <= 1) note = "只差一個字母，注意拼法";
  return { ok: false, note };
}

/* ---------- shared UI ---------- */
function topbar(t, extra = "") { return `<header class="top"><button class="back" data-go="home">‹ 首頁</button><span class="ttl">${t}</span><span class="tr">${extra}</span></header>`; }
function chipsHTML(sel) { return `<div class="chips" id="chips">` + [0, ...WEEKS].map(w => `<button class="chip${w === sel ? " on" : ""}" data-w="${w}">${w ? "Week " + w : "全部"}</button>`).join("") + `</div>`; }
function bindChips(cb) { const el = $("chips"); if (el) el.querySelectorAll(".chip").forEach(b => b.onclick = () => cb(+b.dataset.w)); }
function bindGo() { app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.arg)); }

function qCard(d, type, opts, ans, progress, feedback) {
  const show = !!ans && feedback;
  let h = `<div class="card"><div class="meta"><span>Week ${d.wk}</span><span>${progress}</span></div>`;
  h += `<div class="sent">${sentHTML(d, show ? "show" : "blank", type === "spell" && hintFirst)}</div>`;
  if (type === "spell" || show) h += `<div class="hint">中文：<b>${esc(d.zh)}</b></div>`;
  if (type === "mc") {
    h += `<div class="optlist">` + opts.map((o, k) => {
      let c = "opt";
      if (show) { if (o === d.w) c += " right"; else if (o === ans.given) c += " wrong"; }
      return `<button class="${c}" data-o="${k}"${show ? " disabled" : ""}>${String.fromCharCode(65 + k)}. ${esc(o)}</button>`;
    }).join("") + `</div>`;
    if (!show) h += `<div class="kbd">鍵盤：按 <kbd>A</kbd>–<kbd>D</kbd> 或 <kbd>1</kbd>–<kbd>4</kbd> 作答</div>`;
  } else {
    h += `<form id="spf" autocomplete="off"><input class="sp" id="spi" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="輸入英文單字"${show ? ` disabled value="${esc(ans.given)}"` : ""}>${show ? "" : `<button class="btn pri wide" type="submit">送出</button>`}</form>`;
    if (!show) h += `<div class="kbd">按 <kbd>Enter</kbd> 送出</div>`;
  }
  if (show) {
    h += ans.ok ? `<div class="fb ok">✓ 答對了</div>`
      : `<div class="fb no">✗ 正確答案：<b>${esc(d.w)}</b>${ans.note ? `<br><span>${esc(ans.note)}</span>` : ""}</div>`;
    if (d.alt) h += `<div class="alt">⚠ 推測題：${esc(d.alt)}</div>`;
    h += `<button class="btn pri wide" id="next">下一題</button><div class="kbd">按 <kbd>Enter</kbd> 下一題</div>`;
  }
  return h + `</div>`;
}
function bindQ(d, type, opts, onAnswer, onNext) {
  if (type === "mc") {
    app.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => { const g = opts[+b.dataset.o]; onAnswer(g, g === d.w, ""); });
  } else {
    const f = $("spf"), inp = $("spi");
    if (f && inp && !inp.disabled) {
      f.onsubmit = e => { e.preventDefault(); const g = inp.value; if (!g.trim()) return; const r = checkSpell(d, g); onAnswer(g.trim(), r.ok, r.note); };
      setTimeout(() => { try { inp.focus(); } catch (e) {} }, 30);
    }
  }
  const n = $("next"); if (n && onNext) { n.onclick = onNext; setTimeout(() => { try { n.focus({ preventScroll: true }); } catch (e) {} }, 30); }
}

/* ---------- navigation ---------- */
const S = { view: "home", week: 0 };
let P = null, E = null, C = null, timerId = null, onlyNew = false, listQ = "", armed = null;
const EX = { week: 0, count: 50, type: "mc" };

function go(v, arg) {
  if (timerId) { clearInterval(timerId); timerId = null; }
  armed = null; S.view = v;
  if (v === "mc" || v === "spell") startPractice(v, "all");
  if (v === "wrong") startPractice(arg || "mc", "wrong");
  if (v === "card") startCard();
  render(); window.scrollTo(0, 0);
}
const NARROW = new Set(["mc", "spell", "wrong", "card", "examSetup", "exam", "result"]);
const NAV = [["home", "🏠", "首頁"], ["examSetup", "📝", "模擬考"], ["mc", "🔘", "選擇題練習"], ["spell", "⌨️", "拼字練習"],
  ["wrong", "❗", "錯題本"], ["card", "🃏", "單字卡"], ["list", "📖", "單字表"], ["rules", "🎓", "畢業門檻說明"]];
const side = $("side");
side.innerHTML = `<div class="brand"><b>勤益 115-2</b><span>字彙測驗練習</span></div>` +
  NAV.map(([v, ic, t]) => `<button class="nav" data-go="${v}"${v === "wrong" ? ' data-arg="mc"' : ""}><span class="ic">${ic}</span>${t}${v === "wrong" ? '<span class="badge" id="navWrong" hidden></span>' : ""}</button>`).join("") +
  `<div class="side-foot">同學自製的非官方練習網站。練習紀錄只存在這台裝置。</div>`;
side.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.arg));
function renderSide() {
  const cur = { exam: "examSetup", result: "examSetup" }[S.view] || S.view;
  side.querySelectorAll(".nav").forEach(b => {
    const on = b.dataset.go === cur; b.classList.toggle("on", on);

  });

}
function render() {
  app.className = "wrap v-" + S.view + (NARROW.has(S.view) ? " narrow" : "");
  renderView(); renderSide();
}
function renderView() {
  ({ home: vHome, mc: vPractice, spell: vPractice, wrong: vPractice, card: vCard, list: vList,
     examSetup: vExamSetup, exam: vExam, result: vResult, rules: vRules })[S.view]();
}
function twoTap(id, label, confirmLabel, action) {
  const b = $(id); if (!b) return;
  b.onclick = () => {
    if (armed !== id) { armed = id; b.textContent = confirmLabel; setTimeout(() => { if (armed === id) { armed = null; const x = $(id); if (x) x.textContent = label; } }, 3000); return; }
    armed = null; action();
  };
}

/* ---------- practice (mc / spell / wrong) ---------- */
function startPractice(type, source) {
  const pool = source === "wrong" ? wrongList() : DATA.filter(d => !S.week || d.wk === S.week);
  P = { type, source, deck: shuffle(pool.slice()), i: 0, ans: null, right: 0, done: 0, opts: null };
}
function vPractice() {
  const isW = P.source === "wrong";
  const title = isW ? "錯題本" : (P.type === "mc" ? "選擇題練習" : "拼字練習");
  let h = topbar(title, `答對 ${P.right}/${P.done}`);
  if (!isW) h += chipsHTML(S.week);
  h += `<div class="opts">`;
  if (isW) h += `<div class="seg"><button class="${P.type === "mc" ? "on" : ""}" data-t="mc">選擇題</button><button class="${P.type === "spell" ? "on" : ""}" data-t="spell">拼字</button></div>`;
  if (P.type === "spell") h += `<label><input type="checkbox" id="hint"${hintFirst ? " checked" : ""}>提示字首和字數</label>`;
  h += `</div>`;
  if (!P.deck.length) {
    h += `<div class="card"><div class="empty">${isW ? "目前沒有錯題 🎉<br><span class='small'>練習或模擬考答錯的題目會自動收進來</span>" : "沒有題目"}</div></div>`;
  } else if (P.i >= P.deck.length) {
    const pct = P.done ? Math.round(P.right / P.done * 100) : 0, wl = wrongList().length;
    h += `<div class="card center"><div class="big">${pct}<small>%</small></div><div>這一輪答對 ${P.right} / ${P.done}</div>
      <div class="btns"><button class="btn pri" id="again">再來一輪</button>${wl && !isW ? `<button class="btn" data-go="wrong" data-arg="${P.type}">練錯題（${wl}）</button>` : ""}${isW && wl ? `<button class="btn" id="again2">再練剩下的 ${wl} 題</button>` : ""}</div></div>`;
  } else {
    const d = P.deck[P.i];
    if (P.type === "mc" && !P.opts) P.opts = makeOpts(d);
    h += qCard(d, P.type, P.opts, P.ans, `${P.i + 1} / ${P.deck.length}`, true);
  }
  app.innerHTML = h; bindGo();
  bindChips(w => { S.week = w; startPractice(P.type, "all"); render(); });
  app.querySelectorAll(".seg [data-t]").forEach(b => b.onclick = () => { startPractice(b.dataset.t, "wrong"); render(); });
  const hint = $("hint"); if (hint) hint.onchange = () => { hintFirst = hint.checked; store(K_HINT, hintFirst); render(); };
  const again = $("again"); if (again) again.onclick = () => { startPractice(P.type, P.source); render(); };
  const again2 = $("again2"); if (again2) again2.onclick = () => { startPractice(P.type, "wrong"); render(); };
  if (P.deck.length && P.i < P.deck.length) {
    const d = P.deck[P.i];
    bindQ(d, P.type, P.opts,
      (g, ok, note) => { P.ans = { given: g, ok, note }; P.done++; if (ok) P.right++; record(d.id, ok); render(); },
      () => { P.i++; P.ans = null; P.opts = null; render(); });
  }
}

  const n = Math.min(EX.count, poolN);
  let h = topbar("模擬考");
  h += `<div class="sec">範圍</div>` + chipsHTML(EX.week);
  h += `<div class="sec">題數</div><div class="seg">` + [20, 50, 100, 200].map(c => `<button class="${EX.count === c ? "on" : ""}" data-n="${c}">${c === 200 ? "全部" : c + " 題"}</button>`).join("") + `</div>`;
  h += `<div class="sec">題型</div><div class="seg">` + [["mc", "選擇題"], ["spell", "拼字"], ["mix", "混合"]].map(([k, t]) => `<button class="${EX.type === k ? "on" : ""}" data-ty="${k}">${t}</button>`).join("") + `</div>`;
  if (EX.type !== "mc") h += `<div class="opts" style="margin-top:12px"><label><input type="checkbox" id="hint"${hintFirst ? " checked" : ""}>拼字題提示字首和字數</label></div>`;
  h += `<button class="btn pri wide" id="start">開始考試（${n} 題）</button>`;
  h += `<p class="note">交卷前不會顯示對錯，答錯的題目會自動收進錯題本。20 題以上的模擬考會記錄最佳成績。正式考試一場 60 分鐘（1/19 那場 2 小時）、每天最多考 2 次；正式題型與及格標準以語言中心為準。</p>`;
  app.innerHTML = h; bindGo();
  bindChips(w => { EX.week = w; render(); });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { EX.count = +b.dataset.n; render(); });
  app.querySelectorAll("[data-ty]").forEach(b => b.onclick = () => { EX.type = b.dataset.ty; render(); });
  const hint = $("hint"); if (hint) hint.onchange = () => { hintFirst = hint.checked; store(K_HINT, hintFirst); };
  $("start").onclick = startExam;
}
function startExam() {
  const pool = shuffle(DATA.filter(d => !EX.week || d.wk === EX.week).slice());
  const qs = pool.slice(0, Math.min(EX.count, pool.length)).map(d => {
    const t = EX.type === "mix" ? (Math.random() < 0.5 ? "mc" : "spell") : EX.type;
    return { d, t, opts: t === "mc" ? makeOpts(d) : null };
  });
  E = { qs, i: 0, ans: [], start: Date.now(), end: null };
  armed = null; S.view = "exam"; render(); window.scrollTo(0, 0);
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => { const el = $("timer"); if (el) el.textContent = "⏱ " + fmt(Date.now() - E.start); }, 1000);
}
function vExam() {
  const q = E.qs[E.i];
  let h = topbar("模擬考", `<span id="timer">⏱ ${fmt(Date.now() - E.start)}</span>`);
  h += `<div class="bar"><i style="width:${E.i / E.qs.length * 100}%"></i></div>`;
  h += qCard(q.d, q.t, q.opts, null, `第 ${E.i + 1} / ${E.qs.length} 題`, false);
  h += `<div class="statrow" style="margin-top:8px"><span class="stat">${q.t === "mc" ? "選擇題" : "拼字題"}｜已作答 ${E.i}</span><button class="linkbtn" id="submitAll">提早交卷</button></div>`;
  app.innerHTML = h; bindGo();
  bindQ(q.d, q.t, q.opts, (g, ok, note) => {
    E.ans[E.i] = { given: g, ok, note }; E.i++;
    if (E.i >= E.qs.length) finishExam(); else { render(); window.scrollTo(0, 0); }
  }, null);
  twoTap("submitAll", "提早交卷", "再按一次確認交卷（未答算錯）", finishExam);
}
function finishExam() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  E.end = Date.now();
  E.qs.forEach((q, k) => { const a = E.ans[k]; if (a) record(q.d.id, a.ok); });
  E.right = E.ans.filter(a => a && a.ok).length;
  E.score = Math.round(E.right / E.qs.length * 100);
  E.newBest = false;
  if (E.qs.length >= 20 && (!best || E.score > best.score)) {
    best = { score: E.score, n: E.qs.length, date: new Date().toISOString().slice(0, 10) }; store(K_BEST, best); E.newBest = true;
  }
  armed = null; S.view = "result"; render(); window.scrollTo(0, 0);
}
function vResult() {
  const wrong = E.qs.map((q, k) => ({ q, a: E.ans[k] })).filter(x => !x.a || !x.a.ok);
  let h = topbar("考試結果");
  h += `<div class="card center"><div class="big">${E.score}<small> 分</small></div>
    <div>答對 ${E.right} / ${E.qs.length}｜用時 ${fmt(E.end - E.start)}</div>
    ${E.newBest ? `<div><span class="newbest">🎉 新的最佳成績</span></div>` : (best ? `<div class="small" style="margin-top:6px">最佳成績 ${best.score} 分</div>` : "")}
    <div class="btns"><button class="btn pri" data-go="examSetup">再考一次</button>${wrongList().length ? `<button class="btn" data-go="wrong" data-arg="mc">去錯題本</button>` : ""}<button class="btn" data-go="home">回首頁</button></div></div>`;
  if (wrong.length) {
    h += `<div class="sec">這次答錯的題目（${wrong.length}）</div>` + wrong.map(({ q, a }) =>
      `<div class="item"><div class="s">${sentHTML(q.d, "show")}</div>
       <div class="small" style="margin-top:4px">正確：<b>${esc(q.d.w)}</b>｜你的答案：${a ? `<s>${esc(a.given)}</s>` : "未作答"}｜${esc(q.d.zh)}</div>
       ${a && a.note ? `<div class="small">${esc(a.note)}</div>` : ""}
       ${q.d.alt ? `<div class="alt">⚠ 推測題：${esc(q.d.alt)}</div>` : ""}</div>`).join("");
  } else {
    h += `<p class="empty">全對！太強了 💯</p>`;
  }
  app.innerHTML = h; bindGo();
}

function cardPool() { return DATA.filter(d => (!S.week || d.wk === S.week) && (!onlyNew || !known.has(d.id))); }
function startCard() { C = { deck: shuffle(cardPool().slice()), pos: 0, rev: false }; }
function vCard() {
  let h = topbar("單字卡") + chipsHTML(S.week) +
    `<div class="opts"><label><input type="checkbox" id="onlyNew"${onlyNew ? " checked" : ""}>只看還不熟的</label><button class="btn" id="shuf">重新洗牌</button></div>`;
  if (!C.deck.length) h += `<div class="card"><div class="empty">${onlyNew ? "這個範圍都熟了 🎉" : "沒有題目"}</div></div>`;
  else if (C.pos >= C.deck.length) h += `<div class="card"><div class="empty">這一輪看完了！<div class="btns"><button class="btn pri" id="again">再來一輪</button></div></div></div>`;
  else {
    const d = C.deck[C.pos];
    h += `<div class="card"><div class="meta"><span>Week ${d.wk}</span><span>${C.pos + 1} / ${C.deck.length}</span></div>
      <div class="sent">${sentHTML(d, C.rev ? "show" : "blank", true)}</div>
      <div class="hint">中文：<b>${esc(d.zh)}</b></div>
      ${C.rev ? `<div class="ans">答案：<span class="hl">${esc(d.w)}</span></div>${d.alt ? `<div class="alt">⚠ 推測題：${esc(d.alt)}</div>` : ""}` : ""}
      <div class="row">${C.rev ? `<button class="again" id="bA">還不熟</button><button class="know" id="bK">會了</button>` : `<button class="reveal" id="bR">看答案</button>`}</div>
      <div class="kbd">${C.rev ? "鍵盤：<kbd>←</kbd> 還不熟、<kbd>→</kbd> 會了" : "鍵盤：按 <kbd>空白鍵</kbd> 看答案"}</div></div>`;
  }
  const scope = DATA.filter(d => !S.week || d.wk === S.week), k = scope.filter(d => known.has(d.id)).length;
  h += `<div class="bar"><i style="width:${k / scope.length * 100}%"></i></div><div class="stat">已熟 ${k} / ${scope.length}</div>`;
  app.innerHTML = h; bindGo();
  bindChips(w => { S.week = w; startCard(); render(); });
  $("onlyNew").onchange = e => { onlyNew = e.target.checked; startCard(); render(); };
  $("shuf").onclick = () => { startCard(); render(); };
  const again = $("again"); if (again) again.onclick = () => { startCard(); render(); };
  const bR = $("bR"); if (bR) bR.onclick = () => { C.rev = true; render(); };
  const mark = ok => { const d = C.deck[C.pos]; if (ok) known.add(d.id); else { known.delete(d.id); C.deck.push(d); } store(K_KNOWN, [...known]); C.pos++; C.rev = false; render(); };
  const bA = $("bA"); if (bA) bA.onclick = () => mark(false);
  const bK = $("bK"); if (bK) bK.onclick = () => mark(true);
}

/* ---------- keyboard (desktop) ---------- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  const k = e.key.toLowerCase();
  const opts = app.querySelectorAll(".opt:not([disabled])");
  if (opts.length && k.length === 1) {
    let i = "abcd".indexOf(k); if (i < 0) i = "1234".indexOf(k);
    if (i >= 0 && i < opts.length) { e.preventDefault(); opts[i].click(); return; }
  }
  if (S.view === "card") {
    const bR = $("bR"), bA = $("bA"), bK = $("bK");
    if (bR && (k === " " || k === "enter")) { e.preventDefault(); bR.click(); }
    else if (bA && k === "arrowleft") { e.preventDefault(); bA.click(); }
    else if (bK && k === "arrowright") { e.preventDefault(); bK.click(); }
  }
});

render();
</script>
</body>
</html>
