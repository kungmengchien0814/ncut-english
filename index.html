/* ---------- spaced repetition (Leitner boxes) and daily activity ---------- */
// Each word sits in box 0–5. A miss sends it to box 0, due again today. A right answer moves it up one box,
// due again after INT[box] days, but only when it was due: answering early (cramming) does not skip the wait.
const INT = [0, 1, 2, 4, 7, 14];
function dayStr(dt = new Date()) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return dayStr(new Date(y, m - 1, d + n)); }
const md = s => { const [, m, d] = s.split("-"); return +m + "/" + +d; };
const K_DAYS = "ncut-vocab-days", GOAL = 20;   // answers per day; about the person, not one question bank, so no 1152
let days = load(K_DAYS, {});
if (!days || typeof days !== "object") days = {};
{ const cut = addDays(dayStr(), -60); for (const k of Object.keys(days)) if (k < cut) delete days[k]; }
function bumpDay(n) { const t = dayStr(); days[t] = (days[t] || 0) + n; store(K_DAYS, days); }
function streak() { let d = dayStr(), n = 0; if (!days[d]) d = addDays(d, -1); while (days[d]) { n++; d = addDays(d, -1); } return n; }
function record(id, ok) {
  const t = dayStr(), s = stats[id] || { r: 0, w: 0, last: null };
  ok ? s.r++ : s.w++; s.last = ok ? 1 : 0;
  if (!ok) { s.b = 0; s.due = t; }
  else if (s.b == null || !s.due || s.due <= t) { s.b = Math.min(5, (s.b || 0) + 1); s.due = addDays(t, INT[s.b]); }
  stats[id] = s; store(K_STATS, stats); bumpDay(1);
}
const wrongList = () => DATA.filter(d => stats[d.id] && stats[d.id].last === 0);
const isDue = (s, t) => !!s && (s.b == null || !s.due || s.due <= t);   // records from before boxes existed count as due
const dueList = () => { const t = dayStr(); return DATA.filter(d => isDue(stats[d.id], t)); };
const newList = () => DATA.filter(d => !stats[d.id]);

/* ---------- backup: move records to another device ---------- */
let pendingImport = null, importErr = false;
function ncutKeys() { const ks = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("ncut-")) ks.push(k); } } catch (e) {} return ks; }
function exportData() {
  const data = {};
  ncutKeys().forEach(k => { try { data[k] = localStorage.getItem(k); } catch (e) {} });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "ncut-english", v: 1, date: dayStr(), data })], { type: "application/json" }));
  a.download = `ncut-vocab-backup-${dayStr()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function readImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let j = null; try { j = JSON.parse(fr.result); } catch (e) {}
    const ok = !!j && j.app === "ncut-english" && !!j.data && typeof j.data === "object" &&
      Object.entries(j.data).every(([k, v]) => k.startsWith("ncut-") && typeof v === "string");
    pendingImport = ok ? j : null; importErr = !ok; render();
  };
  fr.onerror = () => { pendingImport = null; importErr = true; render(); };
  fr.readAsText(file);
}
function applyImport() {
  try {
    ncutKeys().forEach(k => localStorage.removeItem(k));
    Object.entries(pendingImport.data).forEach(([k, v]) => localStorage.setItem(k, v));
  } catch (e) {}
  location.reload();
}

/* ---------- daily review (spaced repetition) ---------- */
// One round: words that are due (lowest box first), topped up with new words, R_SIZE in all.
// Boxes 0–2 ask multiple choice, boxes 3–5 ask spelling. A miss comes back a few questions later.
const R_SIZE = 20;
function startReview() {
  const due = shuffle(dueList()).sort((a, b) => (stats[a.id].b || 0) - (stats[b.id].b || 0)).slice(0, R_SIZE);
  const fresh = shuffle(newList()).slice(0, R_SIZE - due.length);
  R = { q: shuffle([...due, ...fresh]).map(d => d.id), i: 0, ans: null, opts: null, type: null, tag: null, said: -1, first: {}, fresh: new Set(fresh.map(d => d.id)) };
}
const firstRight = () => Object.values(R.first).filter(Boolean).length;
function nextDue() {
  const t = dayStr(); let dt = null, n = 0;
  Object.values(stats).forEach(s => { if (s.due && s.due > t) { if (!dt || s.due < dt) { dt = s.due; n = 1; } else if (s.due === dt) n++; } });
  return dt ? { dt, n } : null;
}
function levelsHTML() {
  const c = [0, 0, 0, 0];   // not tried, box 0–1, box 2–3, box 4–5
  DATA.forEach(d => { const s = stats[d.id]; if (!s) c[0]++; else { const b = s.b || 0; c[b <= 1 ? 1 : b <= 3 ? 2 : 3]++; } });
  const names = [L("還沒練過", "Not tried"), L("剛開始記", "Just started"), L("有印象", "Getting there"), L("記熟了", "Solid")];
  return `<div class="lv">` + names.map((nm, k) => `<div class="wkrow"><span class="l">${nm}</span><span class="b"><i style="width:${c[k] / DATA.length * 100}%"></i></span><span class="r">${c[k]}</span></div>`).join("") + `</div>`;
}
function reviewSide() {
  const n = Object.keys(R.first).length;
  return `<aside class="play-side"><div class="ps-box"><div class="ps-lb">${L("這一輪", "This round")}</div>
    <div class="ps-big">${R.q.length - R.i} <small>${L("題要做", "to go")}</small></div>
    <div class="ps-row"><span>${L("一次就答對", "Right first time")}</span><b>${firstRight()} / ${n}</b></div>
    <div class="ps-row"><span>${L("今天已答", "Answered today")}</span><b>${days[dayStr()] || 0} / ${GOAL}</b></div>
    <div class="ps-row"><span>${L("連續天數", "Streak")}</span><b>${streak()}</b></div></div>
    <div class="ps-box"><div class="ps-lb">${L("記憶程度（200 個字）", "Memory level (200 words)")}</div>${levelsHTML()}
    <div class="ps-none" style="margin-top:.5rem">${L("答對的字隔 1、2、4、7、14 天再出現；答錯就從頭來。", "Words you get right come back after 1, 2, 4, 7, then 14 days. A miss starts the word over.")}</div></div>
    ${keysBox(R.type === "mc" ? [["A–D 1–4", L("作答", "Answer")], ["Enter", L("下一題", "Next")]] : [["Enter", L("送出／下一題", "Check / next")]])}</aside>`;
}
function vReview() {
  const left = R.q.length - R.i;
  let h = topbar(L("今日複習", "Daily review"), R.q.length && left > 0 ? L(`剩 ${left} 題`, `${left} to go`) : "");
  if (!R.q.length) {
    const nx = nextDue();
    h += `<div class="card center"><div class="big">🎉</div><div>${L("今天沒有要複習的字，200 個字也都練過了。", "Nothing is due today, and you have tried all 200 words.")}</div>
      ${nx ? `<div class="small" style="margin-top:.375rem">${L(`下一次複習：${md(nx.dt)}，${nx.n} 個字`, `Next review: ${md(nx.dt)}, ${nx.n} words`)}</div>` : ""}
      <div class="btns"><button class="btn pri" data-go="examSetup">${L("做一次模擬考", "Take a mock test")}</button><button class="btn" data-go="match">${L("玩配對遊戲", "Play the matching game")}</button></div></div>`;
  } else if (R.i >= R.q.length) {
    const n = Object.keys(R.first).length, ok = firstRight(), miss = n - ok, more = dueList().length, nw = newList().length;
    const tm = addDays(dayStr(), 1), tmN = DATA.filter(d => { const s = stats[d.id]; return s && s.due && s.due <= tm; }).length;
    const again = more ? L(`再複習 ${Math.min(more, R_SIZE)} 題`, `Review ${Math.min(more, R_SIZE)} more`) : nw ? L(`再學 ${Math.min(nw, R_SIZE)} 個新字`, `Learn ${Math.min(nw, R_SIZE)} new words`) : "";
    h += `<div class="card center"><div class="big">${ok}<small> / ${n}</small></div><div>${L("一次就答對", "right the first time")}</div>
      <p class="small">${miss ? L(`答錯的 ${miss} 個字已經多練一次，明天會再出現。`, `The ${miss} you missed got an extra try and come back tomorrow.`) : L("全部一次就答對 💯", "All right the first time 💯")}${L(`明天要複習 ${tmN} 個字。`, ` ${tmN} due tomorrow.`)}</p>
      <div class="btns">${again ? `<button class="btn pri" id="rAgain">${again}</button>` : ""}<button class="btn" data-go="home">${L("回首頁", "Back to home")}</button></div></div>
      <div class="sec">${L("記憶程度（200 個字）", "Memory level (200 words)")}</div>${levelsHTML()}`;
  } else {
    const id = R.q[R.i], d = DATA[id];
    if (!R.type) { R.type = stats[id] && stats[id].b >= 3 ? "spell" : "mc"; R.tag = id in R.first ? "again" : R.fresh.has(id) ? "new" : "rev"; }
    if (R.type === "mc" && !R.opts) R.opts = makeOpts(d);
    const tg = { again: L("再一次", "Again"), new: L("新字", "New"), rev: L("複習", "Review") }[R.tag];
    h += `<div class="play"><div class="play-main">` + qCard(d, R.type, R.opts, R.ans, `<b class="rtag ${R.tag}">${tg}</b>${R.i + 1} / ${R.q.length}`, true) + `</div>${reviewSide()}</div>`;
  }
  app.innerHTML = h; bindGo();
  const ra = $("rAgain"); if (ra) ra.onclick = () => { startReview(); render(); window.scrollTo(0, 0); };
  if (R.q.length && R.i < R.q.length) {
    const d = DATA[R.q[R.i]];
    bindQ(d, R.type, R.opts, (g, ok, note) => {
      R.ans = { given: g, ok, note };
      if (!(d.id in R.first)) R.first[d.id] = ok;
      if (!ok) R.q.splice(Math.min(R.q.length, R.i + 4), 0, d.id);   // ask it again a few questions later
      record(d.id, ok); render();
    }, () => { R.i++; R.ans = null; R.opts = null; R.type = null; render(); });
    if (R.type === "spell" && listen && !R.ans && R.said !== R.i) { R.said = R.i; say(plainS(d)); }
  }
}

    "You won't see right or wrong until you hand in, and missed questions go to your mistakes list. Mock tests of 20 questions or more record your best score. The real test is 60 minutes (2 hours for the Jan 19 session), at most twice a day. The Language Center sets the official format and passing score.")}</p>`;
  app.innerHTML = h; bindGo();
  bindChips(w => { EX.week = w; render(); });

function startExam() {
  const pool = shuffle(DATA.filter(d => !EX.week || d.wk === EX.week).slice());
  const qs = pool.slice(0, Math.min(EX.count, pool.length)).map(d => {
    const t = EX.type === "mix" ? (Math.random() < 0.5 ? "mc" : "spell") : EX.type;
    return { d, t, opts: t === "mc" ? makeOpts(d) : null };
  });
  E = { qs, i: 0, ans: [], start: Date.now(), end: null };
  armed = null; S.view = "exam"; render(); window.scrollTo(0, 0);
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => { document.querySelectorAll("#timer,[data-timer]").forEach(el => el.textContent = "⏱ " + fmt(Date.now() - E.start)); }, 1000);
}
function vExam() {
  const q = E.qs[E.i];
  let h = topbar(L("模擬考", "Mock test"), `<span id="timer">⏱ ${fmt(Date.now() - E.start)}</span>`);
  h += `<div class="bar play-dup"><i style="width:${E.i / E.qs.length * 100}%"></i></div>`;
  const side = `<aside class="play-side"><div class="ps-box"><div class="ps-lb">${L("用時", "Time")}</div><div class="ps-big" data-timer>⏱ ${fmt(Date.now() - E.start)}</div></div>
    <div class="ps-box"><div class="ps-lb">${L("進度", "Progress")}</div><div class="ps-big">${E.i} <small>/ ${E.qs.length} ${L("已作答", "answered")}</small></div>
    <div class="bar"><i style="width:${E.i / E.qs.length * 100}%"></i></div><div class="ps-none">${L("交卷前不會顯示對錯，提早交卷時沒作答的題目算錯。", "You'll see right or wrong after you hand in. If you hand in early, unanswered questions count as wrong.")}</div></div>
    ${keysBox(q.t === "mc" ? [["A–D 1–4", L("作答", "Answer")]] : [["Enter", L("送出", "Check")]])}</aside>`;
  h += `<div class="play"><div class="play-main">` + qCard(q.d, q.t, q.opts, null, L(`第 ${E.i + 1} / ${E.qs.length} 題`, `Question ${E.i + 1} / ${E.qs.length}`), false) + `</div>${side}</div>`;
  h += `<div class="statrow" style="margin-top:.5rem"><span class="stat">${q.t === "mc" ? L("選擇題", "Multiple choice") : L("拼字題", "Spelling")}${L(`｜已作答 ${E.i}`, ` | ${E.i} answered`)}</span><button class="linkbtn" id="submitAll">${L("提早交卷", "Hand in now")}</button></div>`;
  app.innerHTML = h; bindGo();
  bindQ(q.d, q.t, q.opts, (g, ok, note) => {
    E.ans[E.i] = { given: g, ok, note }; E.i++;
    if (E.i >= E.qs.length) finishExam(); else { render(); window.scrollTo(0, 0); }
  }, null);
  twoTap("submitAll", L("提早交卷", "Hand in now"), L("再按一次確認交卷（未答算錯）", "Tap again to hand in (unanswered count as wrong)"), finishExam);
}
function finishExam() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  E.end = Date.now();
  E.qs.forEach((q, k) => { const a = E.ans[k]; if (a) record(q.d.id, a.ok); });
  E.right = E.ans.filter(a => a && a.ok).length;
  E.score = Math.round(E.right / E.qs.length * 100);
  E.newBest = false;
  if (E.qs.length >= 20 && (!best || E.score > best.score)) {
    best = { score: E.score, n: E.qs.length, date: new Date().toISOString().slice(0, 10) }; store(K_BEST, best); E.newBest = true;
  }
  armed = null; S.view = "result"; render(); window.scrollTo(0, 0);
}

/* ---------- matching game ---------- */
const K_MATCH = "ncut-1152-vocab-match", M_PAIRS = 6;
let matchBest = load(K_MATCH, {});   // range ("0" = all weeks, "6" = Week 6 …) -> best time in ms, wrong-match seconds included
if (!matchBest || typeof matchBest !== "object") matchBest = {};
const zhPlain = d => d.zh.replace(/（[A-Za-z\- ]+）/g, "").trim();   // "敲（knock）" would give the answer away
const secs = ms => (ms / 1000).toFixed(1);
function startMatch() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const pick = [], ws = new Set(), zs = new Set();
  for (const d of shuffle(DATA.filter(x => !S.week || x.wk === S.week))) {
    const w = d.base.toLowerCase(), z = zhPlain(d);
    if (ws.has(w) || zs.has(z)) continue;
    ws.add(w); zs.add(z); pick.push(d); if (pick.length === M_PAIRS) break;
  }
  M = { pick, tiles: shuffle([...pick.map(d => ({ id: d.id, en: true })), ...pick.map(d => ({ id: d.id, en: false }))]),
        sel: null, left: pick.length, start: 0, end: 0, pen: 0, miss: 0, newBest: false };
}
function vMatch() {
  const b = matchBest[String(S.week)];
  const bestTxt = b ? L(`這個範圍最快 ${secs(b)} 秒`, `Best for this range: ${secs(b)} s`) : L("這個範圍還沒有紀錄", "No best time for this range yet");
  let h = topbar(L("配對遊戲", "Matching game")) + chipsHTML(S.week);
  if (M.end) {
    const tm = M.end - M.start + M.pen;
    h += `<div class="card center"><div class="big">${secs(tm)}<small> ${L("秒", "s")}</small></div>
      <div>${M.miss ? L(`配錯 ${M.miss} 次（每次加 1 秒）`, `${M.miss} wrong ${M.miss === 1 ? "match" : "matches"} (+1 s each)`) : L("全部一次就配對成功", "No wrong matches")}</div>
      ${M.newBest ? `<div><span class="newbest">🎉 ${L("這個範圍的新紀錄", "New best for this range")}</span></div>` : `<div class="small" style="margin-top:.375rem">${bestTxt}</div>`}
      <div class="btns"><button class="btn pri" id="mAgain">${L("再玩一組", "Play another set")}</button><button class="btn" data-go="home">${L("回首頁", "Back to home")}</button></div></div>
      <div class="sec">${L("這一組的字（點字看說明）", "Words in this set (tap a word for notes)")}</div><div class="items">` +
      M.pick.map(d => `<div class="item" data-d="${d.id}"><div><span class="w wd">${esc(d.w)}</span><span class="z">${esc(zhPlain(d))}</span></div><div class="s">${sentHTML(d, "show")}</div></div>`).join("") + `</div>`;
  } else {
    h += `<div class="mtop"><span>${L("點一個英文字，再點它的中文意思。配錯會加 1 秒。", "Tap an English word, then its Chinese meaning. A wrong match adds 1 second.")}</span>
      <span class="mclock"><span id="mclock">${secs(M.start ? Date.now() - M.start + M.pen : 0)}</span>${L(" 秒", " s")}<span class="mpen" id="mpen" hidden>+1</span></span></div>`;
    h += `<div class="mgrid">` + M.tiles.map((t, k) => {
      const d = DATA[t.id], tx = t.en ? d.base : zhPlain(d);
      return `<button type="button" class="tile${t.en && tx.length >= 10 ? " long" : ""}${t.gone ? " gone" : ""}${M.sel === k ? " sel" : ""}" data-k="${k}"${t.en ? ' lang="en"' : ""}${t.gone ? " disabled" : ""}>${esc(tx)}</button>`;
    }).join("") + `</div>`;
    h += `<div class="statrow" style="margin-top:.75rem"><span class="stat">${bestTxt}</span><button class="linkbtn" id="mNew">${L("換一組字", "New words")}</button></div>`;
  }
  app.innerHTML = h; bindGo();
  bindChips(w => { S.week = w; startMatch(); render(); });
  ["mAgain", "mNew"].forEach(x => { const el = $(x); if (el) el.onclick = () => { startMatch(); render(); window.scrollTo(0, 0); }; });
  app.querySelectorAll(".tile").forEach(el => el.onclick = () => tapTile(el));
}
function tapTile(el) {
  const k = +el.dataset.k, t = M.tiles[k];
  if (t.gone || M.end) return;
  if (!M.start) {
    M.start = Date.now(); const cur = M;
    timerId = setInterval(() => { const c = $("mclock"); if (c && M === cur) c.textContent = secs(Date.now() - M.start + M.pen); }, 100);
  }
  const prev = M.sel == null ? null : app.querySelector(`.tile[data-k="${M.sel}"]`);
  if (M.sel === k) { M.sel = null; el.classList.remove("sel"); return; }
  if (M.sel == null || M.tiles[M.sel].en === t.en) { if (prev) prev.classList.remove("sel"); M.sel = k; el.classList.add("sel"); return; }
  const a = M.tiles[M.sel]; M.sel = null;
  if (a.id === t.id) {
    a.gone = t.gone = true;
    [prev, el].forEach(x => { x.classList.remove("sel"); x.classList.add("gone"); x.disabled = true; });
    if (--M.left === 0) finishMatch();
  } else {
    M.pen += 1000; M.miss++;
    [prev, el].forEach(x => { x.classList.remove("sel", "bad"); void x.offsetWidth; x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 450); });
    const pc = $("mpen"); if (pc) { pc.hidden = false; clearTimeout(pc._t); pc._t = setTimeout(() => { pc.hidden = true; }, 700); }
  }
}
function finishMatch() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  M.end = Date.now();
  const key = String(S.week), tm = M.end - M.start + M.pen;
  if (!matchBest[key] || tm < matchBest[key]) { matchBest[key] = tm; store(K_MATCH, matchBest); M.newBest = true; }
  bumpDay(M_PAIRS);
  const cur = M; setTimeout(() => { if (S.view === "match" && M === cur) { render(); window.scrollTo(0, 0); } }, 350);
}

/* ---------- keyboard (desktop) ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && popEl) { e.preventDefault(); closePop(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  const k = e.key.toLowerCase();
  const opts = app.querySelectorAll(".opt:not([disabled])");
  if (opts.length && k.length === 1) {
    let i = "abcd".indexOf(k); if (i < 0) i = "1234".indexOf(k);
    if (i >= 0 && i < opts.length) { e.preventDefault(); opts[i].click(); return; }
  }
  if (S.view === "card") {
    const bR = $("bR"), bA = $("bA"), bK = $("bK");
    if (bR && (k === " " || k === "enter")) { e.preventDefault(); bR.click(); }
    else if (bA && k === "arrowleft") { e.preventDefault(); bA.click(); }
    else if (bK && k === "arrowright") { e.preventDefault(); bK.click(); }
  }
});

render();
